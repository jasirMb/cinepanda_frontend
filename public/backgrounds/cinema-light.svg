<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <g id="speaker">
      <rect x="-9" y="-15" width="18" height="30" rx="2"/>
      <circle cx="0" cy="4" r="6"/>
      <circle cx="0" cy="4" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="0" cy="-9" r="2"/>
    </g>
    <g id="headphones">
      <path d="M -13 1 a 13 13 0 0 1 26 0"/>
      <rect x="-14" y="1" width="5" height="12" rx="1.5"/>
      <rect x="9" y="1" width="5" height="12" rx="1.5"/>
    </g>
    <g id="tv">
      <rect x="-14" y="-8" width="28" height="18" rx="2"/>
      <line x1="-6" y1="13" x2="6" y2="13"/>
      <path d="M -4 -13 L 0 -8 L 4 -13" fill="none"/>
    </g>
    <g id="film">
      <rect x="-14" y="-14" width="28" height="28" rx="2"/>
      <line x1="-7" y1="-14" x2="-7" y2="14"/>
      <line x1="7" y1="-14" x2="7" y2="14"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="-14" y1="-7" x2="-7" y2="-7"/>
      <line x1="-14" y1="7" x2="-7" y2="7"/>
      <line x1="7" y1="-7" x2="14" y2="-7"/>
      <line x1="7" y1="7" x2="14" y2="7"/>
    </g>
    <g id="play">
      <circle cx="0" cy="0" r="13"/>
      <path d="M -4 -6 L 6 0 L -4 6 Z" fill="currentColor" stroke="none"/>
    </g>
    <g id="mic">
      <rect x="-5" y="-14" width="10" height="17" rx="5"/>
      <path d="M -8 -2 v 5 a 8 8 0 0 0 16 0 v -5"/>
      <line x1="0" y1="11" x2="0" y2="15"/>
      <line x1="-5" y1="15" x2="5" y2="15"/>
    </g>
    <g id="clap">
      <rect x="-15" y="-3" width="30" height="15" rx="2"/>
      <path d="M -15 -3 L -10 -11 L -5 -3 M -5 -3 L 0 -11 L 5 -3 M 5 -3 L 10 -11 L 15 -3"/>
    </g>
    <g id="music">
      <path d="M -3 -13 L -3 7"/>
      <ellipse cx="-6" cy="7" rx="4" ry="3" fill="currentColor" stroke="none"/>
      <path d="M -3 -13 L 10 -16 L 10 -2"/>
      <ellipse cx="7" cy="-2" rx="3.5" ry="2.6" fill="currentColor" stroke="none"/>
    </g>
    <g id="panda">
      <circle cx="-9" cy="-10" r="4.5" fill="currentColor" stroke="none"/>
      <circle cx="9" cy="-10" r="4.5" fill="currentColor" stroke="none"/>
      <circle cx="-9" cy="-10" r="2" fill="#fff" stroke="none"/>
      <circle cx="9" cy="-10" r="2" fill="#fff" stroke="none"/>
      <circle cx="0" cy="1" r="12"/>
      <ellipse cx="-4.8" cy="-1.5" rx="2.6" ry="3.6" fill="currentColor" stroke="none" transform="rotate(-15 -4.8 -1.5)"/>
      <ellipse cx="4.8" cy="-1.5" rx="2.6" ry="3.6" fill="currentColor" stroke="none" transform="rotate(15 4.8 -1.5)"/>
      <circle cx="-4.8" cy="-1" r="0.9" fill="#fff" stroke="none"/>
      <circle cx="4.8" cy="-1" r="0.9" fill="#fff" stroke="none"/>
      <ellipse cx="0" cy="4.5" rx="1.6" ry="1.1" fill="currentColor" stroke="none"/>
      <path d="M 0 5.5 L 0 7.2 M -2 8 Q 0 9.4 2 8" fill="none"/>
    </g>
  </defs>

  <g fill="none" stroke="#1e293b" color="#1e293b" stroke-width="1.6" opacity="0.11" stroke-linecap="round" stroke-linejoin="round">
    <use href="#speaker" transform="translate(40, 40) rotate(-12)"/>
    <use href="#panda" transform="translate(110, 45) rotate(-6)"/>
    <use href="#headphones" transform="translate(180, 38) rotate(8)"/>
    <use href="#tv" transform="translate(265, 50) rotate(-6)"/>

    <use href="#film" transform="translate(45, 120) rotate(14)"/>
    <use href="#mic" transform="translate(120, 125) rotate(18)"/>
    <use href="#clap" transform="translate(205, 122) rotate(-9)"/>
    <use href="#panda" transform="translate(280, 130) rotate(10)"/>

    <use href="#music" transform="translate(45, 205) rotate(12)"/>
    <use href="#play" transform="translate(120, 200)"/>
    <use href="#headphones" transform="translate(195, 200) rotate(-10)"/>
    <use href="#speaker" transform="translate(275, 215) rotate(15)"/>

    <use href="#panda" transform="translate(50, 285) rotate(8)"/>
    <use href="#tv" transform="translate(135, 285) rotate(10)"/>
    <use href="#film" transform="translate(215, 290) rotate(-12)"/>
    <use href="#mic" transform="translate(290, 285) rotate(-15)"/>
  </g>
</svg>
